<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Studio</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="view"></div>
<div id="drop">Drop your .glb here</div>

<div id="ui">
  <div id="top" class="panel">
    <b>3DStudio</b>
    <span id="status">Loading…</span>
    <button id="fold" title="Show / hide tools">☰</button>
  </div>

  <div id="dock" class="panel">
    <div class="row tools">
      <button data-tool="orbit">🖐 Orbit</button>
      <button data-tool="paint" class="on">🖌 Paint</button>
      <button data-tool="erase">🧽 Erase</button>
      <button data-tool="decal">🏷 Decal</button>
    </div>

    <div id="paintOpts">
      <div class="row">
        <input type="color" id="color" value="#004170" title="Brush colour">
        <button class="sw" data-sw="#004170" style="background:#004170" title="Navy Blue"></button>
        <button class="sw" data-sw="#DA291C" style="background:#DA291C" title="Red"></button>
        <button class="sw" data-sw="#CEAB5D" style="background:#CEAB5D" title="Gold"></button>
        <button class="sw" data-sw="#f4f1e6" style="background:#f4f1e6" title="White"></button>
        <label class="s">Size <input type="range" id="size" min="1" max="25" step="0.5" value="6"></label>
      </div>
      <div class="row">
        <label class="s">Softness <input type="range" id="soft" min="0" max="100" value="35"></label>
        <label class="s">Opacity <input type="range" id="opacity" min="5" max="100" value="100"></label>
        <label class="s" title="Corrects stretching near the poles for standard sphere (equirectangular) UVs"><input type="checkbox" id="eq" checked> Pole correction</label>
      </div>
    </div>

    <div id="decalOpts" hidden>
      <div class="row">
        <label class="btn">Choose decal image<input type="file" id="decalIn" accept="image/*" hidden></label>
        <button id="decalUndo">Remove last decal</button>
        <span class="muted">Tap the ball to place</span>
      </div>
      <div class="row">
        <label class="s">Size <input type="range" id="dsize" min="5" max="80" value="30"></label>
        <label class="s">Rotate <input type="range" id="drot" min="0" max="360" value="0"></label>
      </div>
    </div>

    <div class="row">
      <button id="undo">↶ Undo</button>
      <button id="clear">Clear paint</button>
      <button id="rotY" title="Turn the ball">⟳ Turn</button>
      <button id="rotX" title="Tip the ball">⤵ Tip</button>
      <label class="btn">Load.glb<input type="file" id="glbIn" accept=".glb,.gltf,model/gltf-binary" hidden></label>
    </div>

    <div class="row">
      <button id="xrAR" hidden>📱 Start AR</button>
      <button id="xrVR" hidden>🥽 Start VR</button>
      <span class="muted">Ball Ø</span><input type="number" id="mm" value="67" min="10" max="500" title="Export diameter in mm"><span class="muted">mm</span>
      <button id="exportZip" class="primary">⬇ Export .glb + texture</button>
      <button id="exportPng">Texture PNG</button>
    </div>
    <div class="muted" id="xrNote" hidden></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/exporters/GLTFExporter.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/geometries/DecalGeometry.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const status = m => { $('status').textContent = m; };

/* ---------- renderer / scene ---------- */
const view = $('view');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local');
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
function applyBg(){
  if (renderer.xr.isPresenting) return;
  const c = getComputedStyle(document.documentElement).getPropertyValue('--scene').trim() || '#14171b';
  scene.background = new THREE.Color(c);
}
applyBg();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyBg);
new MutationObserver(applyBg).observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });

scene.add(new THREE.HemisphereLight(0xffffff, 0x556070, 0.95));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(2, 3, 2.5); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(-2, -1, -2); scene.add(fill);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.01, 50);
camera.position.set(0, 0.15, 2.1);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enablePan = true; controls.minDistance = 0.9; controls.maxDistance = 6;

const viewRoot = new THREE.Group(); scene.add(viewRoot);   // moved/scaled in XR
const ball = new THREE.Group(); viewRoot.add(ball);        // diameter = 1 unit
let holder = null, meshes = [];
const decals = [];

/* ---------- texture layers ---------- */
let W = 2048, H = 1024;
const base = document.createElement('canvas'), paint = document.createElement('canvas'), comp = document.createElement('canvas');
const bctx = base.getContext('2d'), pctx = paint.getContext('2d'), cctx = comp.getContext('2d');
let tex = null, dirty = true;
const undoStack = [];

function buildBase(img){
  bctx.fillStyle = '#ecebe0'; bctx.fillRect(0,0,W,H);
  if (img){ bctx.drawImage(img, 0, 0, W, H); return; }
  const n = document.createElement('canvas'); n.width = n.height = 256;
  const nc = n.getContext('2d'), id = nc.createImageData(256,256);
  for (let i=0;i<id.data.length;i+=4){ const v=Math.random()*255; id.data[i]=id.data[i+1]=id.data[i+2]=v; id.data[i+3]=255; }
  nc.putImageData(id,0,0);
  bctx.globalAlpha = 0.07; bctx.fillStyle = bctx.createPattern(n,'repeat'); bctx.fillRect(0,0,W,H); bctx.globalAlpha = 1;
}
function initCanvases(w,h,img){
  W=w; H=h;
  for (const c of [base,paint,comp]){ c.width=W; c.height=H; }
  buildBase(img); undoStack.length = 0; dirty = true;
  if (tex) tex.dispose();
  tex = new THREE.CanvasTexture(comp);
  tex.flipY = false; tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
}
function compose(){ cctx.drawImage(base,0,0); cctx.drawImage(paint,0,0); }

function pushUndo(){
  const c = document.createElement('canvas'); c.width=W; c.height=H; c.getContext('2d').drawImage(paint,0,0);
  undoStack.push(c); if (undoStack.length > 8) undoStack.shift();
}
function undo(){
  const c = undoStack.pop(); if (!c){ status('Nothing to undo'); return; }
  pctx.clearRect(0,0,W,H); pctx.drawImage(c,0,0); dirty = true;
}

/* ---------- model loading ---------- */
function setModel(root, label){
  decals.forEach(d => { ball.remove(d); d.geometry.dispose(); }); decals.length = 0;
  if (holder) ball.remove(holder);
  holder = new THREE.Group(); holder.add(root); ball.add(holder);
  viewRoot.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(holder);
  const size = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3());
  const s = 1 / Math.max(size.x, size.y, size.z, 1e-6);
  holder.scale.setScalar(s); holder.position.copy(ctr).multiplyScalar(-s);

  meshes = [];
  let srcImg = null;
  root.traverse(o => {
    if (o.isMesh && o.geometry.attributes.uv){
      meshes.push(o);
      if (!srcImg && o.material && o.material.map && o.material.map.image) srcImg = o.material.map.image;
    }
  });
  if (!meshes.length){ status('This model has no UV map, so it can\'t be painted. Unwrap it in Blender first.'); return; }

  let w = 2048, h = 1024;
  if (srcImg){ w = Math.min(srcImg.width || srcImg.naturalWidth || 2048, 4096); h = Math.min(srcImg.height || srcImg.naturalHeight || 1024, 4096); }
  pctx.clearRect(0,0,W,H);
  initCanvases(w, h, srcImg);
  meshes.forEach(m => {
    const old = m.material;
    m.material = new THREE.MeshStandardMaterial({
      map: tex, roughness: 0.95, metalness: 0,
      normalMap: old && old.normalMap || null, bumpMap: old && old.bumpMap || null
    });
    m.geometry.computeBoundingSphere();
    if (!m.geometry.attributes.normal) m.geometry.computeVertexNormals();
  });
  status(label + ' · ' + meshes.length + ' paintable mesh' + (meshes.length>1?'es':'') + ' · texture ' + W + '×' + H);
}
function proceduralBall(){
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(0.5, 128, 64), new THREE.MeshStandardMaterial()));
  return g;
}
$('glbIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (f) loadFile(f);
});
async function loadFile(f){
  if (renderer.xr.isPresenting){ status('Exit AR/VR to load a model'); return; }
  try {
    status('Reading ' + f.name + '…');
    const buf = await f.arrayBuffer();
    new THREE.GLTFLoader().parse(buf, '', g => setModel(g.scene, f.name), () => status('Could not read that file'));
  } catch(err){ status('Could not read that file'); }
}
addEventListener('dragover', e => { e.preventDefault(); $('drop').style.display = 'flex'; });
addEventListener('dragleave', e => { if (!e.relatedTarget) $('drop').style.display = 'none'; });
addEventListener('drop', e => {
  e.preventDefault(); $('drop').style.display = 'none';
  const f = e.dataTransfer.files[0]; if (f) loadFile(f);
});

/* ---------- tools ---------- */
let tool = 'paint';
function setTool(t){
  tool = t;
  document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
  $('paintOpts').hidden = !(t === 'paint' || t === 'erase');
  $('decalOpts').hidden = t !== 'decal';
  controls.enabled = true;
  status({ orbit:'Drag to rotate, pinch to zoom', paint:'Drag on the ball to paint', erase:'Drag on the ball to erase', decal:'Tap the ball to place a decal' }[t]);
}
document.querySelectorAll('[data-tool]').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
document.querySelectorAll('[data-sw]').forEach(b => b.addEventListener('click', () => { $('color').value = b.dataset.sw; setTool('paint'); }));
$('undo').addEventListener('click', undo);
$('clear').addEventListener('click', () => { pushUndo(); pctx.clearRect(0,0,W,H); dirty = true; });
$('rotY').addEventListener('click', () => ball.rotateY(Math.PI/6));
$('rotX').addEventListener('click', () => ball.rotateX(Math.PI/6));
$('fold').addEventListener('click', () => { $('dock').hidden = !$('dock').hidden; });

/* ---------- raycasting ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), tmpM = new THREE.Matrix4();
function firstHit(){
  const hits = ray.intersectObjects(meshes, false);
  return hits.find(h => h.uv) || null;
}
function pick(e){
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left)/r.width)*2 - 1, -((e.clientY - r.top)/r.height)*2 + 1);
  ray.setFromCamera(ndc, camera);
  return firstHit();
}

/* ---------- painting ---------- */
const strokes = {};
function hexRGB(h){ const n = parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function brushRy(){ const deg = +$('size').value; return $('eq').checked ? deg/180*H : deg/360*W; }
function stamp(x, y, st){
  const deg = +$('size').value, soft = +$('soft').value/100, op = +$('opacity').value/100;
  const eq = $('eq').checked, erase = tool === 'erase';
  const ry = brushRy();
  const rx = eq ? Math.min(deg/360*W / Math.max(st, 0.06), W/3) : deg/360*W;
  const [r,g,b] = erase ? [0,0,0] : hexRGB($('color').value);
  const hard = 1 - soft;
  pctx.globalCompositeOperation = erase ? 'destination-out' : 'source-over';
  for (const dx of [0, -W, W]){
    const cx = x + dx;
    if (cx + rx < 0 || cx - rx > W) continue;
    pctx.save();
    pctx.translate(cx, y); pctx.scale(rx, ry);
    const grad = pctx.createRadialGradient(0,0,0,0,0,1);
    grad.addColorStop(0, `rgba(${r},${g},${b},${op})`);
    grad.addColorStop(Math.min(hard, 0.999), `rgba(${r},${g},${b},${op})`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    pctx.fillStyle = grad;
    pctx.beginPath(); pctx.arc(0,0,1,0,Math.PI*2); pctx.fill();
    pctx.restore();
  }
  pctx.globalCompositeOperation = 'source-over';
}
function strokeAt(key, hit){
  const s = strokes[key] || (strokes[key] = { last:null, started:false });
  if (!s.started){ pushUndo(); s.started = true; }
  const o = { x: hit.uv.x*W, y: hit.uv.y*H, st: Math.sin(Math.PI*hit.uv.y) };
  const l = s.last;
  if (l){
    const dx = o.x - l.x, dy = o.y - l.y, d = Math.hypot(dx,dy);
    if (d < Math.min(W,H)*0.25){
      const n = Math.max(1, Math.ceil(d / Math.max(1, brushRy()*0.3)));
      for (let i=1;i<=n;i++){ const t=i/n; stamp(l.x+dx*t, l.y+dy*t, l.st+(o.st-l.st)*t); }
    } else stamp(o.x, o.y, o.st);
  } else stamp(o.x, o.y, o.st);
  s.last = o; dirty = true;
}
const endStroke = key => { delete strokes[key]; };

/* ---------- pointer input (desktop + phone, non-XR) ---------- */
const activePointers = new Set();
let tap = null;
view.addEventListener('pointerdown', e => {
  if (renderer.xr.isPresenting) return;
  activePointers.add(e.pointerId);
  if (activePointers.size > 1){ endStroke('mouse'); controls.enabled = true; tap = null; return; }
  if (tool === 'paint' || tool === 'erase'){
    const hit = pick(e);
    if (hit){ controls.enabled = false; strokeAt('mouse', hit); }
  } else if (tool === 'decal'){
    tap = { x:e.clientX, y:e.clientY, t:performance.now() };
  }
}, true);
view.addEventListener('pointermove', e => {
  if (!strokes.mouse) return;
  const hit = pick(e);
  if (hit) strokeAt('mouse', hit); else strokes.mouse.last = null;
});
const up = e => {
  activePointers.delete(e.pointerId);
  if (e.type === 'pointerup' && tap && tool === 'decal'){
    if (Math.hypot(e.clientX - tap.x, e.clientY - tap.y) < 8 && performance.now() - tap.t < 500){
      const hit = pick(e); if (hit) placeDecal(hit);
    }
  }
  tap = null;
  if (!activePointers.size){ endStroke('mouse'); controls.enabled = true; }
};
view.addEventListener('pointerup', up);
view.addEventListener('pointercancel', up);

/* ---------- decals ---------- */
let decalCanvas = document.createElement('canvas'), decalTex = null, decalAspect = 1;
function defaultDecal(){
  const c = decalCanvas; c.width = c.height = 512;
  const x = c.getContext('2d'); x.clearRect(0,0,512,512);
  x.fillStyle = '#16213f'; x.beginPath(); x.arc(256,256,240,0,Math.PI*2); x.fill();
  x.strokeStyle = '#ffffff'; x.lineWidth = 14; x.beginPath(); x.arc(256,256,215,0,Math.PI*2); x.stroke();
  x.fillStyle = '#ffffff'; x.font = '700 150px system-ui,Arial,sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('PSG', 256, 262);
  makeDecalTex(1);
}
function makeDecalTex(aspect){
  decalAspect = aspect;
  if (decalTex) decalTex.dispose();
  decalTex = new THREE.CanvasTexture(decalCanvas);
  decalTex.encoding = THREE.sRGBEncoding;
  decalTex.anisotropy = 8;
}
$('decalIn').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const url = URL.createObjectURL(f), img = new Image();
  img.onload = () => {
    const k = Math.min(1, 1024 / Math.max(img.width, img.height));
    const w = Math.max(1, Math.round(img.width*k)), h = Math.max(1, Math.round(img.height*k));
    decalCanvas = document.createElement('canvas'); decalCanvas.width = w; decalCanvas.height = h;
    decalCanvas.getContext('2d').drawImage(img, 0, 0, w, h);
    makeDecalTex(h / w); URL.revokeObjectURL(url);
    status('Decal image ready — tap the ball to place it');
  };
  img.onerror = () => status('Could not read that image');
  img.src = url;
});
function placeDecal(hit){
  const mesh = hit.object;
  mesh.updateWorldMatrix(true, false);
  const p = hit.point.clone();
  const n = hit.face.normal.clone().transformDirection(mesh.matrixWorld).normalize();
  const o = new THREE.Object3D(); o.position.copy(p); o.lookAt(p.clone().add(n));
  o.rotateZ(THREE.MathUtils.degToRad(+$('drot').value));
  const diameter = ball.getWorldScale(new THREE.Vector3()).x;
  const w = (+$('dsize').value / 100) * diameter;
  const geo = new THREE.DecalGeometry(mesh, p, o.rotation, new THREE.Vector3(w, w*decalAspect, w));
  if (!geo.attributes.position || !geo.attributes.position.count){ status('Decal missed the surface — try again'); return; }
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    map: decalTex, transparent:true, depthWrite:false, polygonOffset:true, polygonOffsetFactor:-4, roughness:0.9, metalness:0
  }));
  m.name = 'decal_' + (decals.length + 1);
  ball.attach(m); decals.push(m);
  status('Decal placed (' + decals.length + ')');
}
$('decalUndo').addEventListener('click', () => {
  const d = decals.pop(); if (!d) return;
  ball.remove(d); d.geometry.dispose(); d.material.dispose(); status('Decal removed');
});

/* ---------- WebXR ---------- */
const xrCtl = [0,1].map(i => {
  const c = renderer.xr.getController(i); c.userData.sel = false; scene.add(c);
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-1)]),
    new THREE.LineBasicMaterial({ color:0xd7ea1d }));
  line.scale.z = 1.2; line.visible = false; line.name = 'rayline'; c.add(line);
  c.addEventListener('selectstart', () => {
    c.userData.sel = true;
    if (tool === 'decal'){ const h = castCtl(c); if (h) placeDecal(h); }
  });
  c.addEventListener('selectend', () => { c.userData.sel = false; endStroke('xr'+i); });
  return c;
});
function castCtl(c){
  tmpM.identity().extractRotation(c.matrixWorld);
  ray.ray.origin.setFromMatrixPosition(c.matrixWorld);
  ray.ray.direction.set(0,0,-1).applyMatrix4(tmpM).normalize();
  ray.near = 0; ray.far = 10;
  return firstHit();
}
let xrMode = null;
renderer.xr.addEventListener('sessionstart', () => {
  scene.background = null;
  viewRoot.position.set(0, 0, -0.6); viewRoot.scale.setScalar(0.22);
  xrCtl.forEach(c => { c.getObjectByName('rayline').visible = xrMode === 'immersive-vr'; });
  status(xrMode === 'immersive-ar' ? 'AR: touch the ball to paint' : 'VR: squeeze trigger on the ball to paint');
});
renderer.xr.addEventListener('sessionend', () => {
  viewRoot.position.set(0,0,0); viewRoot.scale.setScalar(1); applyBg(); xrMode = null; setTool(tool);
});
async function startXR(mode){
  try {
    const opts = mode === 'immersive-ar'
      ? { optionalFeatures:['local','dom-overlay'], domOverlay:{ root:$('ui') } }
      : { optionalFeatures:['local'] };
    const session = await navigator.xr.requestSession(mode, opts);
    xrMode = mode; await renderer.xr.setSession(session);
  } catch(err){ xrMode = null; status('Could not start ' + (mode === 'immersive-ar' ? 'AR' : 'VR') + ': ' + (err && err.message || err)); }
}
$('xrAR').addEventListener('click', () => startXR('immersive-ar'));
$('xrVR').addEventListener('click', () => startXR('immersive-vr'));
document.querySelectorAll('.panel').forEach(p => p.addEventListener('beforexrselect', e => e.preventDefault()));
(async () => {
  const note = $('xrNote');
  if (!navigator.xr){
    note.hidden = false;
    note.textContent = 'WebXR isn\'t available in this browser/context. Use Chrome on Android (AR) or a headset browser, over HTTPS, outside an embedded frame.';
    return;
  }
  const ar = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
  const vr = await navigator.xr.isSessionSupported('immersive-vr').catch(() => false);
  $('xrAR').hidden = !ar; $('xrVR').hidden = !vr;
  if (!ar && !vr){
    note.hidden = false;
    note.textContent = 'No AR/VR session available here. On Android use Chrome with Google Play Services for AR, over HTTPS, outside an embedded frame.';
  }
})();

/* ---------- export ---------- */
const crcT = (() => { const t = new Uint32Array(256); for (let n=0;n<256;n++){ let c=n; for (let k=0;k<8;k++) c = c&1 ? 0xEDB88320 ^ (c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
const crc32 = u8 => { let c = 0xFFFFFFFF; for (let i=0;i<u8.length;i++) c = crcT[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function makeZip(files){
  const enc = new TextEncoder(), parts = [], central = [];
  const now = new Date();
  const dt = ((now.getFullYear()-1980)<<9) | ((now.getMonth()+1)<<5) | now.getDate();
  const tm = (now.getHours()<<11) | (now.getMinutes()<<5) | (now.getSeconds()>>1);
  let off = 0;
  for (const f of files){
    const name = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,tm,true); lh.setUint16(12,dt,true); lh.setUint32(14,crc,true); lh.setUint32(18,sz,true); lh.setUint32(22,sz,true);
    lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer), name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true);
    ch.setUint16(12,tm,true); ch.setUint16(14,dt,true); ch.setUint32(16,crc,true); ch.setUint32(20,sz,true); ch.setUint32(24,sz,true);
    ch.setUint16(28,name.length,true); ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer), name);
    off += 30 + name.length + sz;
  }
  let cd = 0; central.forEach(c => cd += c.length);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true);
  end.setUint32(12,cd,true); end.setUint32(16,off,true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type:'application/zip' });
}
async function saveFile(name, blob){
  let dl = null;
  try { if (window.claude && window.claude.use) dl = await window.claude.use('downloads'); } catch(e){}
  if (dl){
    try { await dl.save({ filename:name, data:blob }); status('Saved ' + name); }
    catch(e){ status(e && e.code === 'declined' ? 'Save cancelled' : 'Could not save (' + (e && e.code || 'error') + ')'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  status('Downloaded ' + name);
}
const canvasBlob = () => new Promise(res => { compose(); comp.toBlob(res, 'image/png'); });
function exportGLB(){
  return new Promise((resolve, reject) => {
    compose(); if (tex) tex.needsUpdate = true;
    const d = Math.max(10, +$('mm').value || 67) / 1000;
    const sv = { p:ball.position.clone(), q:ball.quaternion.clone(), s:ball.scale.clone() };
    ball.position.set(0,0,0); ball.quaternion.identity(); ball.scale.setScalar(d); ball.updateMatrixWorld(true);
    const restore = () => { ball.position.copy(sv.p); ball.quaternion.copy(sv.q); ball.scale.copy(sv.s); ball.updateMatrixWorld(true); };
    const ok = r => { restore(); resolve(r); }, fail = e => { restore(); reject(e); };
    const opts = { binary:true, onlyVisible:true, maxTextureSize:4096 };
    try {
      const ex = new THREE.GLTFExporter();
      if (ex.parse.length >= 4) ex.parse(ball, ok, fail, opts); else ex.parse(ball, ok, opts);
    } catch(e){ fail(e); }
  });
}
$('exportPng').addEventListener('click', async () => {
  if (!tex){ status('Nothing to export yet'); return; }
  saveFile('tennis_ball_texture.png', await canvasBlob());
});
$('exportZip').addEventListener('click', async () => {
  if (!tex){ status('Nothing to export yet'); return; }
  try {
    status('Building export…');
    const glb = await exportGLB();
    const png = await canvasBlob();
    const mm = Math.max(10, +$('mm').value || 67);
    const readme = 'Tennis ball export\n' +
      'tennis_ball.glb  - model with the painted texture embedded' + (decals.length ? ' and ' + decals.length + ' decal mesh(es) layered on the surface' : '') + '\n' +
      'tennis_ball_texture.png - base texture (' + W + 'x' + H + ', sRGB). Decals are separate meshes and are NOT baked into this image.\n' +
      'Model diameter: ' + mm + ' mm (glTF units are metres).\n';
    const files = [
      { name:'tennis_ball.glb', data:new Uint8Array(glb) },
      { name:'tennis_ball_texture.png', data:new Uint8Array(await png.arrayBuffer()) },
      { name:'README.txt', data:new TextEncoder().encode(readme) }
    ];
    await saveFile('tennis_ball_export.zip', makeZip(files));
  } catch(err){ status('Export failed: ' + (err && err.message || err)); }
});

/* ---------- boot ---------- */
function resize(){
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

defaultDecal();
setModel(proceduralBall(), 'Placeholder ball');
setTool('paint');
status('Placeholder ball loaded — use “Load .glb” (or drag a file in) for your own model');

renderer.setAnimationLoop(() => {
  if (!renderer.xr.isPresenting) controls.update();
  else if (tool === 'paint' || tool === 'erase'){
    xrCtl.forEach((c, i) => {
      if (!c.userData.sel) return;
      const hit = castCtl(c);
      if (hit) strokeAt('xr'+i, hit); else if (strokes['xr'+i]) strokes['xr'+i].last = null;
    });
  }
  if (dirty && tex){ compose(); tex.needsUpdate = true; dirty = false; }
  renderer.render(scene, camera);
});
})();
